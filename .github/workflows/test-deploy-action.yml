name: Test Deploy Action

on: [workflow_dispatch]

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup mocks
        run: |
          mkdir -p ~/mocks
          cp -r ./tests/mocks/* ~/mocks/
          echo "$HOME/mocks" >> $GITHUB_PATH
          echo $GITHUB_PATH

      - name: Setup act
        run: |
          echo "test-snap"
          sudo snap
      - name: Run deploy action
        uses: ./deploy
        with:
          environment: "Staging"
          charm_file_path: "./tests/fixtures/test.charm"
          image_url: "ghcr.io/test:latest"
          juju_model: "test-model"
          juju_controller: "test-controller"
          juju_version: "3.6"
          vault_addr: "https://vault.example.com"
          vault_secret_path_role: "secret/role"
          vault_secret_path_common: "secret/common"
          application_name: "test-app"
        env:
          VAULT_APPROLE_ROLE_ID: ${{ secrets.VAULT_APPROLE_ROLE_ID }}
          VAULT_APPROLE_SECRET_ID: ${{ secrets.VAULT_APPROLE_SECRET_ID }}
          GHCR_READ_USERNAME: ${{ secrets.GHCR_READ_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}

      - name: Verify results
        run: |
          apt-get update
          apt-get install -y bats
          bats tests/verify_deploy.bats
